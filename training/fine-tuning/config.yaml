# SopuCoder Training Configuration
project_name: "SopuCoder-FineTuning"
version: "v0.5.0"

# Model Selection
# Recommended base models:
#   - Qwen/Qwen2.5-Coder-7B-Instruct (for sopu-coder)
#   - Qwen/Qwen2.5-Coder-1.5B-Instruct (for sopu-coder-fast)
model_name_or_path: "Qwen/Qwen2.5-Coder-7B-Instruct"
output_dir: "./training/checkpoints/sopu-coder-lora"

# Dataset Paths
train_file: "./datasets/splits/train.jsonl"
validation_file: "./datasets/splits/test.jsonl"
max_seq_length: 4096

# QLoRA / LoRA Hyperparameters
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Training Arguments
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.0002
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
num_train_epochs: 3
logging_steps: 10
save_strategy: "epoch"
evaluation_strategy: "epoch"
bf16: true
fp16: false
gradient_checkpointing: true
optim: "paged_adamw_8bit"
seed: 42

